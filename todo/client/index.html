<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 빈 아이콘: favicon.ico 404가 Console 오류로 남지 않게 함 -->
    <link rel="icon" href="data:," />
    <title>할 일 목록</title>
  </head>
  <body>
    <main class="card">
      <!-- 1·7·2. 입력 폼: 할 일 입력, 마감일, 추가(제출), 입력 지우기 -->
      <form id="todo-form" class="input-row" novalidate>
        <input id="todo-input" type="text" placeholder="할 일을 입력하세요" autocomplete="off" />
        <input id="due-date-input" type="date" aria-label="마감일" />
        <button id="add-button" class="btn btn-primary" type="submit">Add</button>
        <button id="clear-button" class="btn" type="button">Clear</button>
      </form>

      <!-- 8. 상태 필터, 6. 오류 팝업(평소에는 숨김) -->
      <div class="status-row">
        <div class="filters">
          <button id="filter-all" class="btn filter-button selected" type="button">전체</button>
          <button id="filter-active" class="btn filter-button" type="button">진행 중</button>
          <button id="filter-completed" class="btn filter-button" type="button">완료</button>
        </div>
        <div id="error-popup" class="error-popup" role="alert" hidden>
          <span id="error-message"></span>
          <button id="error-close" class="error-close" type="button" aria-label="닫기">×</button>
        </div>
      </div>

      <!-- 3. 할 일 목록 -->
      <ul id="todo-container" class="todo-container"></ul>

      <!-- 4·5. 남은 개수, 완료 항목 삭제 -->
      <footer class="footer">
        <span id="items-left">0 items left</span>
        <button id="clear-completed" class="btn" type="button">Clear completed</button>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
